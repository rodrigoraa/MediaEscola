{% extends "base.html" %}

{% block content %}
<section class="login-page">
    <div class="login-shell">
        <section class="login-panel">
            <img class="login-logo" src="{{ url_for('static', filename='image/logo_escola.png') }}" alt="Logo da escola">
            <h1>Média Escolar</h1>
            <p>Boletins, médias e acompanhamento escolar em um painel único.</p>
        </section>

        <form method="post" class="login-card">
            <div>
                <h1>Entrar</h1>
                <p class="muted">Acesse com seu usuário cadastrado.</p>
            </div>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" value="{{ email or '' }}" required autofocus>

            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" required>

            <label class="check-line">
                <input type="checkbox" name="lembrar" value="1">
                Lembrar-me
            </label>

            <button type="submit">Entrar</button>
        </form>
    </div>
</section>
{% endblock %}
